<!DOCTYPE html>
<html>
<head>
    <title>H265 Player Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: #fff; font-family: monospace; }
        #status { margin-bottom: 20px; }
        canvas { border: 2px solid #0f0; max-width: 100%; }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <canvas id="player-canvas" width="1280" height="720"></canvas>

    <script>
        const status = document.getElementById('status');
        const canvas = document.getElementById('player-canvas');

        function log(msg) {
            console.log(msg);
            status.innerHTML += msg + '<br>';
        }

        // Setup Module for WASM
        window.Module = window.Module || {};
        window.Module.locateFile = function (path) {
            if (path.endsWith(".wasm") || path.endsWith(".data")) {
                return "/vendor/h265-web-player/" + path;
            }
            return path;
        };

        window.canvas = canvas;

        // Load scripts
        const scripts = [
            '/vendor/h265-web-player/webgl.js',
            '/vendor/h265-web-player/pcm-player.js',
            '/vendor/h265-web-player/decoder.js',
            '/vendor/h265-web-player/player.js'
        ];

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    log(`✓ Loaded: ${src}`);
                    resolve();
                };
                script.onerror = () => {
                    log(`✗ Failed: ${src}`);
                    reject();
                };
                document.head.appendChild(script);
            });
        }

        async function init() {
            try {
                // Load all scripts
                for (const src of scripts) {
                    await loadScript(src);
                }

                log('All scripts loaded. Initializing player...');

                if (typeof Player === 'undefined') {
                    log('✗ Player class not found!');
                    return;
                }

                const player = new Player();
                const videoUrl = '/api/video/00000031--299875828f/3/front';

                log(`Initializing player with: ${videoUrl}`);

                player.init({
                    width: 1280,
                    height: 720,
                    canvas: canvas,
                    url: videoUrl
                });

                log('✓ Player initialized!');

            } catch (error) {
                log(`✗ Error: ${error.message}`);
                console.error(error);
            }
        }

        init();
    </script>
</body>
</html>
